# PostgreSQL Configuration for Travel Doodles on a 2 vCPU / 4 GB RAM VPS
# Total Dedicated Memory Allocation: ~1,100 MB

# Connectivity
listen_addresses = '*'
max_connections = 25

# Memory Configuration
shared_buffers = 256MB
effective_cache_size = 768MB
work_mem = 4MB
maintenance_work_mem = 64MB

# Write Ahead Log (WAL)
wal_buffers = 16MB
min_wal_size = 256MB
max_wal_size = 1GB
checkpoint_completion_target = 0.9

# Query Planner & Cost
random_page_cost = 1.1
effective_io_concurrency = 200
default_statistics_target = 100

# Logging
log_destination = 'stderr'
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d.log'
log_min_messages = warning
log_min_error_statement = error
log_min_duration_statement = 250 # Log queries taking longer than 250ms (slow query monitoring)

# Autovacuum settings for spatial indexes
autovacuum = on
autovacuum_max_workers = 2
autovacuum_vacuum_scale_factor = 0.1
autovacuum_analyze_scale_factor = 0.05
