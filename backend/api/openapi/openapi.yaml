openapi: 3.0.3
info:
  title: Travel Doodles API
  version: 1.0.0
  description: >
    Production backend REST API for Travel Doodles — a map-first social travel application.
    Engineered for ultra-low memory overhead, PostGIS geospatial clustering, and seamless 4GB VPS operation.
servers:
  - url: http://localhost:8080
    description: Local development server
  - url: https://api.traveldoodles.app
    description: Production server

paths:
  /healthz:
    get:
      summary: Liveness check
      responses:
        '200':
          description: Service is alive
  /readyz:
    get:
      summary: Readiness check
      responses:
        '200':
          description: Service dependencies are healthy
        '503':
          description: Degraded dependencies
  /metrics:
    get:
      summary: Prometheus operational metrics
      responses:
        '200':
          description: Prometheus formatted metric text

  /api/v1/auth/register:
    post:
      summary: Register with password (DISABLED - returns 400 directing to passwordless)
      deprecated: true
      responses:
        '400':
          description: Password authentication disabled; directs client to passwordless registration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/login:
    post:
      summary: Login with password (DISABLED - returns 400 directing to passwordless)
      deprecated: true
      responses:
        '400':
          description: Password authentication disabled; directs client to passwordless login
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/passwordless/register:
    post:
      summary: Instant passwordless account creation (device-bound credentials)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordlessRegisterRequest'
      responses:
        '201':
          description: Account created successfully with custom ID and session cookie set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/Error'
        '409':
          description: Custom ID or username conflict

  /api/v1/auth/passwordless/login:
    post:
      summary: Instant passwordless login via device-bound credential token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordlessLoginRequest'
      responses:
        '200':
          description: Session established
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid device credential

  /api/v1/auth/oauth:
    post:
      summary: Passwordless OAuth2 social authentication (Google, Apple, GitHub)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthLoginRequest'
      responses:
        '200':
          description: Authenticated and session established
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/Error'

  /api/v1/auth/passkey/register/start:
    post:
      summary: Begin WebAuthn passkey registration challenge
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasskeyRegisterStartRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasskeyRegisterStartResponse'

  /api/v1/auth/passkey/register/finish:
    post:
      summary: Complete WebAuthn passkey registration with attestation
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasskeyRegisterFinishRequest'
      responses:
        '200':
          description: Passkey registered successfully

  /api/v1/auth/passkey/login/start:
    post:
      summary: Begin WebAuthn passkey authentication challenge
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasskeyLoginStartRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasskeyLoginStartResponse'

  /api/v1/auth/passkey/login/finish:
    post:
      summary: Complete WebAuthn passkey authentication with assertion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasskeyLoginFinishRequest'
      responses:
        '200':
          description: Authenticated and session established
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'

  /api/v1/auth/logout:
    post:
      summary: Revoke session and clear session cookie
      responses:
        '200':
          description: Logged out successfully

  /api/v1/auth/me:
    get:
      summary: Retrieve currently authenticated user profile
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/posts:
    get:
      summary: List public travel posts with keyset pagination
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPosts'
    post:
      summary: Publish a new travel post with geographic coordinates
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePostRequest'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/posts/{id}:
    get:
      summary: Get post detail by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Edit post caption, visibility, or location name
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePostRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
    delete:
      summary: Soft-delete post
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Post deleted successfully

  /api/v1/posts/map:
    get:
      summary: Zoom-dependent geographic post discovery and spatial clustering
      parameters:
        - name: bbox
          in: query
          required: true
          description: Bounding box as minLon,minLat,maxLon,maxLat
          schema:
            type: string
            example: "-122.5,37.7,-122.3,37.8"
        - name: zoom
          in: query
          description: Map zoom level (0-20)
          schema:
            type: integer
            default: 5
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MapResponse'
        '400':
          $ref: '#/components/responses/Error'

  /api/v1/posts/nearby:
    get:
      summary: Discover posts within radial distance using PostGIS ST_DWithin
      parameters:
        - name: lon
          in: query
          required: true
          schema:
            type: number
        - name: lat
          in: query
          required: true
          schema:
            type: number
        - name: radius_km
          in: query
          schema:
            type: number
            default: 25.0
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  posts:
                    type: array
                    items:
                      $ref: '#/components/schemas/PostMarker'

  /api/v1/feed:
    get:
      summary: Personalized friends feed using fan-out-on-read
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPosts'

  /api/v1/users/{username}:
    get:
      summary: Retrieve traveler profile with follow stats and public posts count
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
    patch:
      summary: Update own traveler profile
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name:
                  type: string
                bio:
                  type: string
                avatar_key:
                  type: string
      responses:
        '200':
          description: Profile updated

  /api/v1/users/custom-id:
    patch:
      summary: Update user customizable ID
      description: Allows user to personalize their unique custom ID (e.g. wanderer_dan) used for friend invitations and typing in IDs.
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCustomIDRequest'
      responses:
        '200':
          description: Custom ID updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  custom_id:
                    type: string
        '400':
          $ref: '#/components/responses/Error'
        '409':
          description: Custom ID already taken by another traveler

  /api/v1/friends:
    get:
      summary: List mutual friends of the authenticated user
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: List of mutual friends
          content:
            application/json:
              schema:
                type: object
                properties:
                  friends:
                    type: array
                    items:
                      $ref: '#/components/schemas/Friend'

  /api/v1/friends/add:
    post:
      summary: Add a friend directly by typing their user ID or custom ID
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddFriendByIDRequest'
      responses:
        '201':
          description: Friend added successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Friend'
        '400':
          description: Cannot friend yourself, or blocked
        '404':
          description: User ID or custom ID not found

  /api/v1/friends/invites:
    post:
      summary: Generate a shareable friend invitation link / code
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInviteRequest'
      responses:
        '201':
          description: Invite code and URL generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FriendInvite'

  /api/v1/friends/invites/{code}:
    get:
      summary: Preview a friend invite code before accepting
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FriendInvite'
        '404':
          description: Invite code not found, expired, or depleted

  /api/v1/friends/invites/{code}/accept:
    post:
      summary: Accept a friend invite link / code
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Invite accepted and friendship established
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Friend'
        '400':
          description: Cannot accept own invite, already friends, or blocked
        '404':
          description: Invalid or expired invite code

  /api/v1/friends/{id}:
    delete:
      summary: Remove a friend by friend's user UUID
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Friendship removed

  /api/v1/users/{id}/follow:
    post:
      summary: Follow a traveler
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Followed
    delete:
      summary: Unfollow a traveler
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Unfollowed

  /api/v1/users/{id}/block:
    post:
      summary: Block a traveler
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User blocked
    delete:
      summary: Unblock a traveler
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User unblocked

  /api/v1/posts/{id}/likes:
    post:
      summary: Like a post idempotently
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Post liked
    delete:
      summary: Remove like from a post
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Post unliked

  /api/v1/posts/{id}/comments:
    get:
      summary: List comments for a post
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedComments'
    post:
      summary: Add a comment to a post
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                parent_id:
                  type: string
                  format: uuid
      responses:
        '201':
          description: Comment created

  /api/v1/comments/{id}:
    delete:
      summary: Delete a comment
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Comment deleted

  /api/v1/media/uploads:
    post:
      summary: Request presigned S3 upload URL for direct photo upload
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content_type, file_size]
              properties:
                content_type:
                  type: string
                  example: image/jpeg
                file_size:
                  type: integer
                  example: 3145728
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadAuthResponse'

  /api/v1/media/uploads/{id}/complete:
    post:
      summary: Confirm direct S3 upload completion and trigger async variant pipeline
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Upload confirmed

  /api/v1/notifications:
    get:
      summary: List notifications for authenticated user
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  notifications:
                    type: array
                    items:
                      $ref: '#/components/schemas/Notification'

  /api/v1/notifications/{id}/read:
    patch:
      summary: Mark a notification as read
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Marked as read

  /api/v1/notifications/read-all:
    post:
      summary: Mark all notifications as read
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: All marked as read

  /api/v1/reports:
    post:
      summary: Report abusive content or violation
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_type, target_id, reason]
              properties:
                target_type:
                  type: string
                  enum: [post, user, comment]
                target_id:
                  type: string
                  format: uuid
                reason:
                  type: string
      responses:
        '201':
          description: Report recorded

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: travel_session
    bearerAuth:
      type: http
      scheme: bearer

  responses:
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error:
      description: Bad request or validation failure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    RegisterRequest:
      type: object
      required: [username, email, password, display_name]
      properties:
        username:
          type: string
          example: traveler_alice
        email:
          type: string
          format: email
          example: alice@traveldoodles.app
        password:
          type: string
          format: password
          minLength: 8
        display_name:
          type: string
          example: Alice Walker
        bio:
          type: string

    LoginRequest:
      type: object
      required: [login, password]
      properties:
        login:
          type: string
          example: traveler_alice
        password:
          type: string
          format: password

    AuthResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        custom_id:
          type: string
          example: wanderer_alice
        email:
          type: string
        display_name:
          type: string
        bio:
          type: string
        avatar_url:
          type: string
        auth_provider:
          type: string
          example: passwordless_device
        created_at:
          type: string
          format: date-time

    UserProfileResponse:
      type: object
      properties:
        profile:
          type: object
          properties:
            id:
              type: string
            username:
              type: string
            custom_id:
              type: string
            display_name:
              type: string
            bio:
              type: string
            avatar_url:
              type: string
            post_count:
              type: integer
            follower_count:
              type: integer
            following_count:
              type: integer
            friend_count:
              type: integer
            is_following:
              type: boolean
            is_friend:
              type: boolean
            is_self:
              type: boolean

    PasswordlessRegisterRequest:
      type: object
      required: [display_name]
      properties:
        username:
          type: string
          example: alice
        custom_id:
          type: string
          example: wanderer_alice
        display_name:
          type: string
          example: Alice Walker
        credential_token:
          type: string
          description: Optional device-bound client secret or token
        bio:
          type: string

    PasswordlessLoginRequest:
      type: object
      required: [identifier, credential_token]
      properties:
        identifier:
          type: string
          description: Username, custom ID, or user UUID
          example: wanderer_alice
        credential_token:
          type: string
          description: Device credential token

    OAuthLoginRequest:
      type: object
      required: [provider, token]
      properties:
        provider:
          type: string
          enum: [google, apple, github]
          example: google
        token:
          type: string
          description: ID token or access token from provider
        custom_id:
          type: string
          example: alice_in_wonderland
        display_name:
          type: string
        email:
          type: string

    PasskeyRegisterStartRequest:
      type: object
      properties:
        username:
          type: string
        custom_id:
          type: string
        display_name:
          type: string

    PasskeyRegisterStartResponse:
      type: object
      properties:
        challenge:
          type: string
        rp:
          type: object
          properties:
            name:
              type: string
            id:
              type: string
        user:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
            displayName:
              type: string
        pubKeyCredParams:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
              alg:
                type: integer
        timeout:
          type: integer

    PasskeyRegisterFinishRequest:
      type: object
      required: [credential_id, public_key]
      properties:
        credential_id:
          type: string
        public_key:
          type: string
        attestation_object:
          type: string
        client_data_json:
          type: string

    PasskeyLoginStartRequest:
      type: object
      properties:
        custom_id:
          type: string

    PasskeyLoginStartResponse:
      type: object
      properties:
        challenge:
          type: string
        timeout:
          type: integer
        rpId:
          type: string

    PasskeyLoginFinishRequest:
      type: object
      required: [credential_id, signature, authenticator_data, client_data_json]
      properties:
        credential_id:
          type: string
        signature:
          type: string
        authenticator_data:
          type: string
        client_data_json:
          type: string

    UpdateCustomIDRequest:
      type: object
      required: [custom_id]
      properties:
        custom_id:
          type: string
          minLength: 3
          maxLength: 32
          pattern: '^[a-zA-Z0-9_-]+$'
          example: wanderlust_jen

    AddFriendByIDRequest:
      type: object
      required: [target_id]
      properties:
        target_id:
          type: string
          description: Friend's customizable ID (e.g. wanderer_dan) or account UUID
          example: wanderer_dan

    CreateInviteRequest:
      type: object
      properties:
        max_uses:
          type: integer
          default: 1
          example: 5
        expires_in_hours:
          type: integer
          default: 168
          example: 72

